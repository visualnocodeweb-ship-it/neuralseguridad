<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligencia de datos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600&family=Outfit:wght@500;600&family=Sora:wght@500;600&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                        fraunces: ['Fraunces', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        sora: ['Sora', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body, #root {
            height: 100%;
            overflow: hidden;
        }
        body {
            margin: 0;
            background-color: #f4f7fb;
            color: #020617;
        }
        .jarvis-grid {
            background-image:
                linear-gradient(rgba(14, 165, 233, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.07) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(ellipse at center, black 45%, transparent 82%);
        }
        @keyframes jarvis-scan {
            0% { transform: translateY(-80px); opacity: 0; }
            12% { opacity: 0.85; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .jarvis-scan {
            height: 72px;
            background: linear-gradient(180deg, transparent, rgba(56, 189, 248, 0.14), transparent);
            animation: jarvis-scan 9s linear infinite;
        }
        @keyframes network-pulse {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.9; }
        }
        .network-pulse {
            animation: network-pulse 2.4s ease-in-out infinite;
        }
        @keyframes network-flow {
            to { stroke-dashoffset: -180; }
        }
        .network-flow {
            stroke-dasharray: 5 9;
            animation: network-flow 2.8s linear infinite;
        }
        @keyframes network-node {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes stack-drift {
            0%, 100% { transform: translateY(0); opacity: 0.45; }
            50% { transform: translateY(-8px); opacity: 0.85; }
        }
        .stack-word {
            animation: stack-drift 8s ease-in-out infinite;
        }
        .graph-scroll {
            scrollbar-width: none;
        }
        .graph-scroll::-webkit-scrollbar {
            display: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
